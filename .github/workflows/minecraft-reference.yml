name: Minecraft Java - APK jogavel de referencia

on:
  push:
    paths:
      - '.github/workflows/minecraft-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-reference:
    name: Compilar launcher Java real (ARM64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Clonar base publica oficial sem modificar
        run: |
          git init upstream
          cd upstream
          git remote add origin https://github.com/ZalithLauncher/ZalithLauncher2.git
          git fetch --depth=1 origin 3ad5a786b042a6e8f0953b8697f00e9c2b89fdc9
          git checkout FETCH_HEAD
          git submodule update --init --recursive --depth=1
      - name: Preparar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Instalar cargo-ndk
        run: |
          mkdir -p "$HOME/.cargo/bin"
          version="4.1.2"
          curl -fL --retry 3 "https://github.com/bbqsrc/cargo-ndk/releases/download/v${version}/cargo-ndk-x86_64-unknown-linux-gnu-v${version}.tgz" |
            tar xz -C "$HOME/.cargo/bin" --strip-components=1
          chmod +x "$HOME/.cargo/bin"/cargo-ndk*
          cargo ndk --version
      - name: Configurar Android NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$ndk" ] || [ ! -f "$ndk/source.properties" ]; then
            sdkmanager --install "ndk;27.0.12077973"
            ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          test -f "$ndk/source.properties"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - name: Compilar APK ARM64 de referencia
        working-directory: upstream
        env:
          OAUTH_CLIENT_ID: ''
          CURSEFORGE_API_KEY: ''
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace ZalithLauncher:assembleDebug -Darch=arm64
      - name: Inspecionar pacote Android
        run: |
          find upstream/ZalithLauncher/build/outputs/apk/debug -type f -name '*.apk' -print
          ls -lh upstream/ZalithLauncher/build/outputs/apk/debug/*.apk
          unzip -t upstream/ZalithLauncher/build/outputs/apk/debug/*.apk | tail -2
      - name: Guardar APK jogavel de referencia
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Java-Reference-ARM64-APK
          path: upstream/ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
