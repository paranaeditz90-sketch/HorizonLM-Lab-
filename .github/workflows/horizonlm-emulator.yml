name: HorizonLM Java Alpha - Android Emulator Test

on:
  push:
    paths:
      - '.github/workflows/horizonlm-emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-reference:
    name: Compilar e abrir HorizonLM no emulador x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Obter motor Minecraft Java upstream (GPLv3)
        run: |
          git init upstream
          cd upstream
          git remote add origin https://github.com/ZalithLauncher/ZalithLauncher2.git
          git fetch --depth=1 origin 3ad5a786b042a6e8f0953b8697f00e9c2b89fdc9
          git checkout FETCH_HEAD
          git submodule update --init --recursive --depth=1
      - name: Personalizar nome e identificador, preservar atribuicoes
        working-directory: upstream
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("ZalithLauncher/gradle.properties")
          s = p.read_text()
          changes = {
            "launcher_name=ZalithLauncher": "launcher_name=HorizonLM",
            "launcher_app_name=Zalith Launcher": "launcher_app_name=HorizonLM - Modificacao nao oficial",
            "launcher_short_name=ZL2": "launcher_short_name=HLM",
            "url_home=https://github.com/ZalithLauncher/ZalithLauncher2": "url_home=https://github.com/paranaeditz90-sketch/HorizonLM-Lab-"
          }
          for old, new in changes.items():
              if old not in s: raise SystemExit(f"Propriedade upstream mudou: {old}")
              s = s.replace(old, new, 1)
          p.write_text(s)
          p = Path("ZalithLauncher/build.gradle.kts")
          s = p.read_text()
          old = 'applicationIdSuffix = ".v2"'
          if old not in s: raise SystemExit("Identificador upstream mudou")
          p.write_text(s.replace(old, 'applicationIdSuffix = ".horizonlm"', 1))
          print("Aplicativo HorizonLM, variante nao oficial, id separado do original")
          PY
      - name: Preparar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Instalar cargo-ndk
        run: |
          mkdir -p "$HOME/.cargo/bin"
          version="4.1.2"
          curl -fL --retry 3 "https://github.com/bbqsrc/cargo-ndk/releases/download/v${version}/cargo-ndk-x86_64-unknown-linux-gnu-v${version}.tgz" |
            tar xz -C "$HOME/.cargo/bin" --strip-components=1
          chmod +x "$HOME/.cargo/bin"/cargo-ndk*
          cargo ndk --version
      - name: Configurar Android NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$ndk" ] || [ ! -f "$ndk/source.properties" ]; then
            sdkmanager --install "ndk;27.0.12077973"
            ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          test -f "$ndk/source.properties"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - name: Compilar HorizonLM x86_64
        working-directory: upstream
        env:
          OAUTH_CLIENT_ID: ''
          CURSEFORGE_API_KEY: ''
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace ZalithLauncher:assembleDebug -Darch=x86_64
      - name: Inspecionar pacote Android
        run: |
          find upstream/ZalithLauncher/build/outputs/apk/debug -type f -name '*.apk' -print
          ls -lh upstream/ZalithLauncher/build/outputs/apk/debug/*.apk
          unzip -t upstream/ZalithLauncher/build/outputs/apk/debug/*.apk | tail -2
      - name: Preparar permissao KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador Android - tres aberturas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p test-results
            APK=$(find upstream/ZalithLauncher/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
            test -n "$APK"
            adb install -r "$APK"
            APP=com.movtery.zalithlauncher.horizonlm.debug
            for i in 1 2 3; do
              adb shell am force-stop "$APP" || true
              adb logcat -c
              adb shell monkey -p "$APP" -c android.intent.category.LAUNCHER 1 | tee "test-results/start-$i.txt"
              sleep 15
              adb logcat -d -v brief > "test-results/logcat-$i.txt"
              if ! adb shell pidof "$APP" | tr -d '\r' | grep -Eq '[0-9]+'; then
                echo "Aplicativo fechou durante abertura $i"
                exit 1
              fi
              if grep -qE 'FATAL EXCEPTION|Fatal signal' "test-results/logcat-$i.txt"; then
                echo "Erro fatal no log na abertura $i"
                exit 1
              fi
              adb shell screencap -p /sdcard/screen.png
              adb pull /sdcard/screen.png "test-results/screen-$i.png" >/dev/null
            done
      - name: Publicar logs e imagens de emulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HorizonLM-Emulator-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Guardar APK HorizonLM Alpha
        uses: actions/upload-artifact@v4
        with:
          name: HorizonLM-Java-Alpha-x86_64-APK
          path: upstream/ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
